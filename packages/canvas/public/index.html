<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GENIUS@WORK — Studio treści</title>
    <link rel="preload" href="/fonts/inter-latin-v1.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-mono-400-latin-v1.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/reels.css" />
    <link rel="stylesheet" href="/publisher.css" />
    <link rel="stylesheet" href="/ui-shell.css" />
    <link rel="icon" href="/genius.svg" type="image/svg+xml" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand-block"><div class="brand-mark">GENIUS@WORK</div><div class="brand-title">Studio treści</div><div class="brand-caption">local command center</div></div>
        <nav id="primary-nav" class="primary-nav" aria-label="Główna nawigacja"></nav>
        <section class="sidebar-card run-sidebar" hidden>
          <div class="panel-title">Projekty</div>
          <div id="run-list" class="run-list"></div>
        </section>
        <div class="sidebar-footer"><div class="footer-status"><span class="local-dot"></span><span>Praca lokalna</span><span class="spacer"></span><span>v0.1</span></div><div class="footer-note">Sterowanie przez terminal / Codex</div></div>
      </aside>
      <main class="main">
        <header class="topbar"><span id="active-kicker">Rolki</span><span id="active-title" class="title-line">Studio rolek</span></header>
        <section class="content">
          <div class="app-metrics" hidden><span id="metric-runs"></span><span id="metric-nodes"></span><span id="metric-prompts"></span><span id="metric-assets"></span></div>
          <nav id="sub-tabs" class="tabs" aria-label="Widoki aplikacji"></nav>
          <div id="tab-content" class="tab-content"></div>
        </section>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
